<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Double Pendulum 3D simulation preview">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde6f0"/>
      <stop offset="100%" stop-color="#5d6877"/>
    </linearGradient>
    <radialGradient id="bobA" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="60%" stop-color="#6fb6ff"/>
      <stop offset="100%" stop-color="#15406c"/>
    </radialGradient>
    <radialGradient id="bobB" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1dc"/>
      <stop offset="55%" stop-color="#ff9a55"/>
      <stop offset="100%" stop-color="#7a2a08"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fb6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9a5fff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid / vignette pulse -->
  <g opacity="0.06" stroke="#9bb6d6" stroke-width="1">
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>

  <!-- chaotic trail (a sampled lissajous-ish curve drawn through points) -->
  <path d="M 760 470 C 820 440 870 380 840 320 C 810 260 700 230 640 280 C 580 330 600 410 670 430 C 740 450 810 410 800 350 C 790 290 700 280 660 320"
        fill="none" stroke="url(#trail)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- pendulum -->
  <g transform="translate(620 140)">
    <!-- pivot -->
    <circle r="14" fill="#222b3a" stroke="#3d4a60" stroke-width="2"/>
    <circle r="22" fill="none" stroke="#6fb6ff" stroke-opacity="0.35" stroke-width="2"/>
    <!-- rod 1 -->
    <line x1="0" y1="0" x2="120" y2="170" stroke="url(#rod)" stroke-width="6" stroke-linecap="round"/>
    <!-- joint -->
    <circle cx="120" cy="170" r="10" fill="#2a3344" stroke="#465169" stroke-width="2"/>
    <circle cx="120" cy="170" r="16" fill="none" stroke="#6fb6ff" stroke-opacity="0.32" stroke-width="2"/>
    <!-- rod 2 -->
    <line x1="120" y1="170" x2="60" y2="340" stroke="url(#rod)" stroke-width="6" stroke-linecap="round"/>
    <!-- bobs -->
    <circle cx="120" cy="170" r="22" fill="url(#bobA)" filter="url(#glow)"/>
    <circle cx="60" cy="340" r="28" fill="url(#bobB)" filter="url(#glow)"/>
  </g>

  <!-- title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#d9e4f1">
    <text x="80" y="200" font-size="22" letter-spacing="6" fill="#6fb6ff" font-weight="500" opacity="0.9">CHAOTIC DYNAMICS</text>
    <text x="80" y="280" font-size="76" font-weight="500" letter-spacing="-1">Double Pendulum</text>
    <text x="80" y="340" font-size="40" font-weight="300" fill="#8a98ad" letter-spacing="2">Real-time 3D physics simulation</text>
    <text x="80" y="540" font-size="18" letter-spacing="3" fill="#5b6779">LAGRANGIAN · RK4 · WEBGL2 · INTERACTIVE</text>
  </g>
</svg>
