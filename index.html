    <style>
      :root {
        color-scheme: dark;
        --ui-bg: rgba(10, 14, 22, 0.62);
        --ui-border: rgba(140, 180, 230, 0.18);
        --ui-text: #d9e4f1;
        --ui-muted: #8a98ad;
        --accent: #6fb6ff;
        --accent-warm: #ff9a55;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070d;
        color: var(--ui-text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0);
        white-space: nowrap; border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        outline: none;
        touch-action: none;
      }
      .overlay {
        position: fixed;
        pointer-events: none;
        z-index: 10;
      }
      .top-bar {
        top: 0; left: 0; right: 0;
        padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }
      .title {
        font-size: 14px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ui-muted);
      }
      .title strong {
        display: block;
        font-size: 22px;
        letter-spacing: 0.08em;
        color: var(--ui-text);
        margin-top: 4px;
        font-weight: 500;
      }
      .hud {
        pointer-events: auto;
        background: var(--ui-bg);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid var(--ui-border);
        border-radius: 14px;
        padding: 14px 18px;
        font-size: 12px;
        line-height: 1.6;
        min-width: 220px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      }
      .hud h3 {
        margin: 0 0 8px 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ui-muted);
      }
      .hud .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-variant-numeric: tabular-nums;
      }
      .hud .row span:first-child { color: var(--ui-muted); }
      .hud .row span:last-child { color: var(--ui-text); font-weight: 500; }
      .bottom-bar {
        bottom: 0; left: 0; right: 0;
        padding: 14px max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
      }
      .actions {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .actions .btn {
        width: 100%;
        text-align: center;
      }
      .btn {
        background: var(--ui-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--ui-border);
        color: var(--ui-text);
        padding: 10px 18px;
        min-height: 40px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.18s ease;
        font-family: inherit;
        touch-action: manipulation;
      }
      .btn:hover {
        background: rgba(30, 50, 80, 0.7);
        border-color: rgba(140, 180, 230, 0.4);
      }
      .btn.active {
        background: rgba(111, 182, 255, 0.18);
        border-color: rgba(111, 182, 255, 0.55);
        color: var(--accent);
      }
      #graphs {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 320px;
      }
      .graph-card {
        background: var(--ui-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--ui-border);
        border-radius: 12px;
        padding: 10px 12px 6px;
      }
      .graph-card canvas {
        width: 100%;
        height: 80px;
        display: block;
      }
      .graph-card .label {
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ui-muted);
        margin-bottom: 4px;
      }
      .hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ui-muted);
        pointer-events: none;
        opacity: 0.7;
        z-index: 5;
      }
      .lil-gui {
        --background-color: rgba(10, 14, 22, 0.72) !important;
        --widget-color: rgba(40, 55, 75, 0.7) !important;
        --focus-color: rgba(111, 182, 255, 0.4) !important;
        --hover-color: rgba(60, 80, 110, 0.7) !important;
        --title-background-color: rgba(20, 28, 40, 0.85) !important;
        --title-text-color: #d9e4f1 !important;
        --text-color: #d9e4f1 !important;
        --number-color: #ff9a55 !important;
        --string-color: #6fb6ff !important;
        --font-size: 11px !important;
        --input-font-size: 11px !important;
        --padding: 6px !important;
        --spacing: 4px !important;
        --slider-knob-width: 3px !important;
        --slider-input-width: 28% !important;
        --color-input-width: 28% !important;
        --slider-input-min-width: 30px !important;
        --slider-knob-color: var(--accent) !important;
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        border: 1px solid var(--ui-border) !important;
        border-radius: 12px !important;
        overflow: hidden;
        z-index: 20;
      }
      .lil-gui.root > .title {
        font-size: 11px !important;
        letter-spacing: 0.18em !important;
        text-transform: uppercase;
        font-weight: 600 !important;
      }

      /* ---------------- Mobile / narrow viewport ---------------- */
      @media (max-width: 720px) {
        .top-bar { padding: max(10px, env(safe-area-inset-top)) 14px 0 14px; }
        .title { font-size: 11px; letter-spacing: 0.18em; }
        .title strong { font-size: 16px; margin-top: 2px; }
        .bottom-bar {
          padding: 12px 12px max(12px, env(safe-area-inset-bottom)) 12px;
          flex-direction: column-reverse;
          align-items: stretch;
          gap: 10px;
        }
        .actions {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 6px;
          justify-content: center;
        }
        .actions .btn { width: auto; flex: 1 1 calc(50% - 6px); }
        .btn {
          padding: 11px 12px;
          font-size: 11px;
          letter-spacing: 0.06em;
        }
        #graphs { max-width: 100%; }
        .graph-card canvas { height: 60px; }
        .hint { display: none; }
        .lil-gui {
          --width: calc(100vw - 24px) !important;
          top: auto !important;
          bottom: auto !important;
          left: 12px !important;
          right: 12px !important;
          width: calc(100vw - 24px) !important;
          max-width: 100vw;
          max-height: 55vh;
        }
        .lil-gui.root > .children { max-height: calc(55vh - 30px); overflow-y: auto; }
      }

      /* Touch-only refinements (covers phones and most tablets) */
      @media (pointer: coarse) {
        .btn { min-height: 44px; }
        .hint { display: none; }
      }

      /* Landscape phones — keep things from stealing all the height */
      @media (max-height: 480px) and (orientation: landscape) {
        .bottom-bar { padding: 8px 12px; gap: 8px; }
        .actions .btn { padding: 8px 12px; min-height: 36px; font-size: 10px; }
        .graph-card canvas { height: 44px; }
      }

      #loader {
        position: fixed;
        inset: 0;
        background: #05070d;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ui-muted);
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        z-index: 100;
        transition: opacity 0.6s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

    <main id="app" aria-label="Double pendulum simulation viewport"></main>

    <nav class="overlay bottom-bar" aria-label="Simulation controls">

        <button class="btn" id="btn-reset" type="button" aria-label="Reset the simulation to initial conditions">Reset</button>

        <button class="btn" id="btn-cam" type="button" aria-pressed="false" aria-label="Toggle cinematic auto-orbiting camera">Cinematic Cam</button>
        <button class="btn" id="btn-graphs" type="button" aria-pressed="false" aria-label="Toggle scientific overlay graphs">Graphs</button>
        <button class="btn" id="btn-ghost" type="button" aria-pressed="false" aria-label="Toggle Lyapunov divergence ghost pendulum">Lyapunov Ghost</button>
      </div>
      <div id="graphs" aria-hidden="true"></div>
    </nav>

    <p class="hint" role="note">Drag a mass &middot; Pinch / scroll to zoom &middot; Two-finger or right-drag to pan</p>
